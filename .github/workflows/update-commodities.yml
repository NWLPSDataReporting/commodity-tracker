name: Update Daily Commodities

on:
  schedule:
    # Runs at 20:00 UTC (8:00 PM UTC) every day of the week
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit the CSV file back into the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch Script
        run: python fetch_commodities.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Commodities_Daily.csv
          git commit -m "Auto-update daily commodity prices [skip ci]" || echo "No changes to commit"
          git push
